name: Build and Release Singularity Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Singularity/Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.0

      - name: Build Singularity Image
        run: |
          apptainer build tract-specific-gratio.sif Singularity.def

      - name: Upload SIF as Artifact (For testing)
        uses: actions/upload-artifact@v4
        with:
          name: tract-specific-gratio-sif
          path: tract-specific-gratio.sif

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tract-specific-gratio.sif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
