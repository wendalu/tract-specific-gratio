name: Build and Release Singularity Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Apptainer via PPA
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build Singularity Image
        run: |
          sudo apptainer build tract-specific-gratio.sif Singularity.def

      - name: Upload SIF as Artifact (For testing)
        uses: actions/upload-artifact@v4
        with:
          name: tract-specific-gratio-sif
          path: tract-specific-gratio.sif

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tract-specific-gratio.sif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
